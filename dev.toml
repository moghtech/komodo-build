[[build]]
name = "komodo-cli-dev"
description = """
OPEN FOR INSTRUCTIONS

Must run the following command on host to create the builder:
'docker buildx create --name builder --use --bootstrap'
"""
tags = ["dev", "cli"]
[build.config]
builder = "x86_64-builder"
version = "2.0.0"
auto_increment_version = false
image_name = "komodo-cli"
image_tag = "dev"
