links = [
  "https://github.com/moghtech/komodo/pkgs/container/komodo-cli"
]
repo = "moghtech/komodo"
branch = "2.0.0"
dockerfile_path = "bin/cli/multi-arch.Dockerfile"
image_registry = [
  { domain = "ghcr.io", account = "mbecker20", organization = "moghtech" },
  { domain = "docker.io", account = "moghtech" }
]
extra_args = [
  "--platform linux/amd64,linux/arm64",
  "--builder builder"
]
