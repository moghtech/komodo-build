[[build]]
name = "komodo-binaries-aarch64"
tags = ["komodo", "release", "binaries", "aarch64"]
[build.config]
builder = "aarch64-builder"
version = "2.3.0"
auto_increment_version = false
image_name = "komodo-binaries"
image_tag = "aarch64"
include_latest_tag = false
repo = "moghtech/komodo"
dockerfile_path = "bin/binaries.Dockerfile"
image_registry = [
  { domain = "ghcr.io", account = "mbecker20", organization = "moghtech" },
]

