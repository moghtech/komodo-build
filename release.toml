[[build]]
name = "komodo-cli"
tags = ["komodo", "release", "cli"]
[build.config]
builder = "x86_64-builder"
version = "2.3.0"
auto_increment_version = false
include_latest_tag = false
links = ["https://github.com/moghtech/komodo/pkgs/container/komodo-cli"]
repo = "moghtech/komodo"
dockerfile_path = "bin/cli/multi-arch.Dockerfile"
image_registry = [
  { domain = "ghcr.io", account = "mbecker20", organization = "moghtech" },
  { domain = "docker.io", account = "moghtech" },
]
extra_args = ["--platform linux/amd64,linux/arm64", "--builder builder"]
pre_build.command = """
  docker buildx create --name builder --use --bootstrap
"""

