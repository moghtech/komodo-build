##

[[repo]]
name = "upload-komodo-binaries"
tags = ["komodo", "release", "binaries"]
[repo.config]
builder = "x86_64-builder"
git_provider = "forge.mogh.tech"
repo = "public/komodo-build"
on_clone.command = """
bash ./upload-binaries.sh \
  [[KOMODO_RELEASE_TAG]] \
  ghcr.io/moghtech/komodo-binaries:2 \
  [[KOMODO_RELEASE_VERSION]] \
  [[MOGH_FORGE_TOKEN]]
"""

##

[[procedure]]
name = "build-komodo-release"
tags = ["komodo", "release"]

[[procedure.config.stage]]
name = "Build Binaries + UI"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "komodo-binaries-x86_64", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "komodo-binaries-aarch64", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "komodo-ui", enabled = true },
]

[[procedure.config.stage]]
name = "Build Release Images + Publish Binaries"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "komodo-core", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "komodo-periphery", enabled = true },
  { execution.type = "RunBuild", execution.params.build = "komodo-cli", enabled = true },
  { execution.type = "BuildRepo", execution.params.repo = "upload-komodo-binaries", enabled = true },
]

##

[[procedure]]
name = "build-komodo-release-ui-only"
tags = ["komodo", "release", "ui"]

[[procedure.config.stage]]
name = "Build UI"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "komodo-ui", enabled = true },
]

[[procedure.config.stage]]
name = "Build Core"
enabled = true
executions = [
  { execution.type = "RunBuild", execution.params.build = "komodo-core", enabled = true },
]

##

[[action]]
name = "publish-komodo-release"
tags = ["komodo", "release"]
[action.config]
file_contents = """
const BRANCH = "main";
const VERSION = "2.3.0";
const TAG = "release-1";

await komodo.write("UpdateVariableValue", {
  name: "KOMODO_RELEASE_VERSION",
  value: VERSION,
});
console.log("Updated KOMODO_RELEASE_VERSION to", VERSION);

await komodo.write("UpdateVariableValue", {
  name: "KOMODO_RELEASE_TAG",
  value: TAG,
});
console.log("Updated KOMODO_RELEASE_TAG to", TAG);

const builds = await komodo.read("ListBuilds", { query: { tags: ["komodo", "release"] } });

for (const build of builds) {
  await komodo.write("UpdateBuild", {
    id: build.id,
    config: { version: VERSION as any, branch: BRANCH },
  });
  console.log("Updated", build.name);
}

await komodo.write("CommitSync", { sync: "komodo-release" });
console.log("Committed changes to 'komodo-release' Sync");

await komodo.execute("RunProcedure", { procedure: "build-komodo-release" });
console.log("Launched 'build-komodo-release' Procedure");
"""
