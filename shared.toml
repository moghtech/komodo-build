[[repo]]
name = "komodo/build"
tags = ["shared"]
[repo.config]
git_provider = "forge.mogh.tech"
git_account = "max"
repo = "komodo/build"

##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["shared"]
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[builder]]
name = "aarch64-builder"
tags = ["shared"]
[builder.config]
type = "Aws"
params.region = "us-east-2"
params.instance_type = "c7g.4xlarge"
params.ami_id = "ami-0bb16c30a5239fcbe"
params.subnet_id = "subnet-02ae5ad480eacc4bc"
params.key_pair_name = "komodo-key"
params.assign_public_ip = true
params.use_public_ip = true
params.security_group_ids = ["sg-0babe545ecfb49c9b"]
params.user_data = """
#!/bin/bash
curl -sSL https://raw.githubusercontent.com/moghtech/komodo/2.0.0/scripts/setup-periphery.py | \
  HOME=/root python3 - --version=v2.0.0-dev-124 \
  --config-url="https://raw.githubusercontent.com/moghtech/komodo/refs/heads/2.0.0/config/periphery.config.toml"
"""

##

[[builder]]
name = "x86_64-builder"
tags = ["shared"]
[builder.config]
type = "Aws"
params.region = "us-east-2"
params.instance_type = "c5.4xlarge"
params.ami_id = "ami-001272df4015756b5"
params.subnet_id = "subnet-02ae5ad480eacc4bc"
params.key_pair_name = "komodo-key"
params.assign_public_ip = true
params.use_public_ip = true
params.security_group_ids = ["sg-0babe545ecfb49c9b"]
params.user_data = """
#!/bin/bash
curl -sSL https://raw.githubusercontent.com/moghtech/komodo/2.0.0/scripts/setup-periphery.py | \
  HOME=/root python3 - --version=v2.0.0-dev-124 \
  --config-url="https://raw.githubusercontent.com/moghtech/komodo/refs/heads/2.0.0/config/periphery.config.toml"
"""

##

[[resource_sync]]
name = "dev"
tags = ["shared"]
[resource_sync.config]
linked_repo = "komodo/build"
resource_path = ["dev.toml"]
managed = true
match_tags = ["dev"]

##

[[resource_sync]]
name = "release"
tags = ["shared"]
[resource_sync.config]
linked_repo = "komodo/build"
resource_path = ["release.toml"]
managed = true
match_tags = ["release"]

##

[[resource_sync]]
name = "shared"
tags = ["shared"]
[resource_sync.config]
linked_repo = "komodo/build"
resource_path = ["shared.toml"]
managed = true
match_tags = ["shared"]